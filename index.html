<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Colorization AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <i class="fas fa-palette header-icon"></i>
        <div>
            <h1>Image Colorization AI</h1>
            <p>Transform Black & White to Vibrant Color</p>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2><i class="fas fa-upload"></i> Upload Black & White Image</h2>
            <div class="drop-zone" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Drag & Drop or Click</h3>
                <p>PNG, JPG, JPEG supported</p>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>
            <button class="btn btn-primary" id="colorizeBtn" disabled>
                <i class="fas fa-magic"></i> Colorize Image
            </button>
        </div>

        <div class="card loading" id="loading" style="display:none">
            <div class="spinner"></div>
            <h3>AI Processing...</h3>
            <p>Adding colors to your image</p>
        </div>

        <div class="card results" id="results" style="display:none">
            <h2><i class="fas fa-images"></i> Result</h2>
            <div class="comparison">
                <div class="image-box">
                    <h3>Original (B&W)</h3>
                    <img id="originalImg">
                </div>
                <div class="image-box">
                    <h3>Colorized (AI)</h3>
                    <img id="colorizedImg">
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-success" id="downloadBtn">
                    <i class="fas fa-download"></i> Download
                </button>
                <button class="btn btn-secondary" id="newBtn">
                    <i class="fas fa-redo"></i> New Image
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>Image Colorization AI | Deep Learning Project by MANJUNADH</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
